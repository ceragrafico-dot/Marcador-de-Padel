<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marcador Pádel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --home: #ff3b3b;
    --guest: #00e676;
    --bg: #1a1a2e;
    --panel: rgba(0,0,0,0.75);
    --yellow: #ffd700;
    --cyan: #00e5ff;
    --gray: #888;
  }

  body, html {
    height: 100%;
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(255,59,59,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(0,230,118,0.08) 0%, transparent 60%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 59px,
        rgba(255,255,255,0.02) 59px,
        rgba(255,255,255,0.02) 60px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 59px,
        rgba(255,255,255,0.02) 59px,
        rgba(255,255,255,0.02) 60px
      );
    color: white;
    min-height: 100vh;
  }

  /* ─── LOGIN ─────────────────────────────────────── */
  #loginModal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    backdrop-filter: blur(6px);
  }
  #login {
    background: rgba(10,10,30,0.95);
    padding: 50px 60px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.04);
    display: flex; flex-direction: column; gap: 18px;
    width: 340px;
  }
  #login h2 {
    font-family: 'Oswald', sans-serif;
    text-align: center; font-size: 1.8em; letter-spacing: 4px;
    text-transform: uppercase; color: white;
  }
  #login h2 span { color: var(--home); }
  #login input {
    padding: 12px 16px; font-size: 1.1em; font-family: 'Rajdhani', sans-serif;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: white;
    outline: none; transition: border-color 0.2s;
  }
  #login input:focus { border-color: var(--cyan); }
  #login button {
    padding: 14px; font-size: 1.2em; font-family: 'Oswald', sans-serif;
    letter-spacing: 3px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #00c853, #00e676);
    color: white; font-weight: 700; cursor: pointer;
    transition: all 0.25s; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,230,118,0.4);
  }
  #login button:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,230,118,0.6); }
  #errorMsg { color: var(--home); text-align: center; font-weight: 600; font-size: 1em; min-height: 1.2em; }

  /* ─── MARCADOR ──────────────────────────────────── */
  #marcador {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    gap: 24px;
  }

  .panel {
    background: var(--panel);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 8px 60px rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    padding: 36px 50px 60px;
    position: relative;
    width: 100%; max-width: 760px;
  }

  .equipos {
    display: flex; justify-content: center;
    gap: 60px; flex-wrap: wrap;
  }

  .equipo {
    display: flex; flex-direction: column;
    align-items: center; min-width: 200px;
  }

  .titulo {
    font-family: 'Oswald', sans-serif;
    font-size: 1.8em; letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer; padding: 4px 8px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 220px;
  }
  .titulo:hover { border-bottom-color: rgba(255,255,255,0.3); }

  .score {
    font-family: 'Oswald', sans-serif;
    font-size: 7em; font-weight: 700; line-height: 1;
    letter-spacing: 4px; margin: 12px 0;
    text-shadow: 0 0 20px currentColor, 0 0 50px currentColor;
    transition: transform 0.15s ease;
    min-width: 140px; text-align: center;
  }
  .score.animar { transform: scale(1.25); }
  .home  { color: var(--home); }
  .guest { color: var(--guest); }

  /* Deuce / Ventaja badge */
  .badge {
    font-size: 0.8em; font-family: 'Oswald', sans-serif;
    letter-spacing: 2px; padding: 3px 10px;
    border-radius: 20px; text-transform: uppercase;
    margin-bottom: 4px; min-height: 26px;
    transition: all 0.3s;
  }
  .badge.deuce { background: rgba(255,215,0,0.2); color: var(--yellow); border: 1px solid var(--yellow); }
  .badge.ventaja { background: rgba(0,229,255,0.15); color: var(--cyan); border: 1px solid var(--cyan); }
  .badge.empty { opacity: 0; }

  .sets { display: flex; gap: 12px; margin-top: 10px; }
  .set {
    font-family: 'Oswald', sans-serif;
    font-size: 2.6em; width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #333; border-radius: 12px;
    background: rgba(0,0,0,0.4);
    text-shadow: 0 0 12px currentColor;
    transition: all 0.3s;
    position: relative;
  }
  .set.activo {
    border: 2px solid var(--yellow);
    animation: pulso 1.2s infinite alternate;
  }
  .set.tiebreak { font-size: 1.6em; }
  @keyframes pulso {
    from { box-shadow: 0 0 8px var(--yellow); }
    to   { box-shadow: 0 0 22px var(--yellow), 0 0 40px rgba(255,215,0,0.3); }
  }

  /* Divisor central */
  .divisor {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: rgba(255,255,255,0.2);
    font-size: 2em;
  }

  /* Saque */
  .saque {
    position: absolute; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 40px;
  }
  .flecha {
    font-size: 2em; opacity: 0.15;
    text-shadow: 0 0 8px white;
    transition: all 0.3s;
  }
  .flecha.activa {
    opacity: 1;
    text-shadow: 0 0 12px var(--cyan), 0 0 30px var(--cyan);
    animation: parpadeo 1.8s infinite;
  }
  @keyframes parpadeo {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Cronómetro */
  #cronometro {
    font-family: 'Oswald', sans-serif;
    font-size: 1.6em; letter-spacing: 4px;
    color: rgba(255,255,255,0.55);
  }

  /* Botones */
  .botones {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: center;
    width: 100%; max-width: 760px;
  }
  .botones button {
    font-family: 'Oswald', sans-serif;
    padding: 11px 22px; font-size: 1.1em;
    border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .botones button::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.15s;
  }
  .botones button:hover { transform: translateY(-3px); }
  .botones button:hover::after { background: rgba(255,255,255,0.08); }
  .botones button:active { transform: translateY(0); }

  .homeBtn  { background: var(--home);  color: white; box-shadow: 0 4px 20px rgba(255,59,59,0.4); }
  .guestBtn { background: var(--guest); color: #000;  box-shadow: 0 4px 20px rgba(0,230,118,0.4); }
  .resetBtn { background: #ff8f00; color: white; box-shadow: 0 4px 20px rgba(255,143,0,0.4); }
  .undoBtn  { background: #455a64; color: white; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  .whatsBtn { background: #25D366;  color: white; box-shadow: 0 4px 20px rgba(37,211,102,0.4); }
  .fullBtn  { background: #1565c0;  color: white; box-shadow: 0 4px 20px rgba(21,101,192,0.4); }

  /* Set ganado flash */
  @keyframes setFlash {
    0%   { background: rgba(255,215,0,0.3); }
    100% { background: transparent; }
  }
  .panel.setflash { animation: setFlash 0.8s ease; }

  /* Responsive */
  @media (max-width: 620px) {
    .panel { padding: 24px 16px 56px; }
    .equipos { gap: 24px; }
    .score { font-size: 4.5em; min-width: 100px; }
    .titulo { font-size: 1.3em; }
    .set { font-size: 2em; width: 46px; height: 46px; }
    .saque { padding: 0 20px; }
    .botones button { padding: 9px 14px; font-size: 0.95em; }
    .divisor { font-size: 1.5em; }
  }
</style>
</head>
<body>

<!-- ─── LOGIN ──────────────────────────────────── -->
<div id="loginModal">
  <div id="login">
    <h2>🎾 Pádel <span>Score</span></h2>
    <input type="text"     id="usuario"  placeholder="Usuario"     autocomplete="username" />
    <input type="password" id="password" placeholder="Contraseña"  autocomplete="current-password" />
    <button onclick="login()">Entrar</button>
    <div id="errorMsg"></div>
  </div>
</div>

<!-- ─── MARCADOR ────────────────────────────────── -->
<div id="marcador">
  <div class="panel" id="panel">
    <div class="equipos">

      <div class="equipo">
        <div class="titulo home"  id="nombreHome"  onclick="editarNombre('home')">HOME</div>
        <div class="badge empty"  id="badgeHome"></div>
        <div id="scoreHome"  class="score home">0</div>
        <div class="sets">
          <div id="setHome1" class="set home">0</div>
          <div id="setHome2" class="set home">0</div>
          <div id="setHome3" class="set home">0</div>
        </div>
      </div>

      <div class="divisor">
        <span style="font-size:0.6em;letter-spacing:2px;opacity:0.4;font-family:'Oswald',sans-serif;">VS</span>
      </div>

      <div class="equipo">
        <div class="titulo guest" id="nombreGuest" onclick="editarNombre('guest')">GUEST</div>
        <div class="badge empty"  id="badgeGuest"></div>
        <div id="scoreGuest" class="score guest">0</div>
        <div class="sets">
          <div id="setGuest1" class="set guest">0</div>
          <div id="setGuest2" class="set guest">0</div>
          <div id="setGuest3" class="set guest">0</div>
        </div>
      </div>

    </div>
    <div class="saque">
      <div id="flechaIzq" class="flecha">⬅</div>
      <div id="flechaDer" class="flecha activa">➡</div>
    </div>
  </div>

  <div id="cronometro">00:00:00</div>

  <div class="botones">
    <button class="homeBtn"  onclick="sumar('home')">+ HOME</button>
    <button class="homeBtn"  onclick="restar('home')">− HOME</button>
    <button class="guestBtn" onclick="sumar('guest')">+ GUEST</button>
    <button class="guestBtn" onclick="restar('guest')">− GUEST</button>
    <button class="undoBtn"  onclick="deshacer()">↩ UNDO</button>
    <button class="undoBtn"  onclick="cambiarSaque()">⇄ SAQUE</button>
    <button class="resetBtn" onclick="resetear()">↺ RESET</button>
    <button class="fullBtn"  onclick="toggleFullScreen()">⛶ FULL</button>
    <button class="whatsBtn" onclick="enviarWhatsApp()">📲 ENVIAR</button>
  </div>
</div>

<script>
// ─── Credenciales ──────────────────────────────────────────────────────────
const USER = "admin";
const PASS = "padel123";

// ─── Estado ────────────────────────────────────────────────────────────────
// puntos[index] → valor a mostrar
// índices: 0=0, 1=15, 2=30, 3=40, 4=AD (ventaja), 5=WIN (señal interna)
const PUNTOS_DISPLAY = ["0","15","30","40","AD","W"];
// index máximo antes de ganar el punto: index 4 (AD) → siguiente es ganar
// Si hay deuce (ambos en 3=40), el siguiente punto da ventaja, no gana directo.

let idxHome = 0, idxGuest = 0;
let setsHome  = [0,0,0], setsGuest = [0,0,0];
let setActual = 0;
let saqueDerecha = true;
let historial = [];
let nombreHome = "HOME", nombreGuest = "GUEST";
let inicio = null, timerInterval = null;
let enTiebreak = false; // si el juego actual es tie-break

// ─── Helpers: estado de deuce / ventaja ────────────────────────────────────
function esDeuce()    { return idxHome === 3 && idxGuest === 3; }
function hayVentaja() { return (idxHome === 4 && idxGuest === 3) || (idxHome === 3 && idxGuest === 4); }
function quienTieneVentaja() {
  if (idxHome === 4 && idxGuest === 3) return "home";
  if (idxHome === 3 && idxGuest === 4) return "guest";
  return null;
}

// ─── Login ─────────────────────────────────────────────────────────────────
function login() {
  const usuario  = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value.trim();
  if (usuario === USER && password === PASS) {
    document.getElementById("loginModal").style.display = "none";
    document.getElementById("marcador").style.display   = "flex";
    cargarEstado();
    actualizarMarcador();
    iniciarCronometro();
  } else {
    document.getElementById("errorMsg").textContent = "Usuario o contraseña incorrectos";
  }
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

// ─── Animación de score ────────────────────────────────────────────────────
function animarScore(id) {
  const el = document.getElementById(id);
  el.classList.add("animar");
  setTimeout(() => el.classList.remove("animar"), 200);
}

function flashPanel() {
  const p = document.getElementById("panel");
  p.classList.remove("setflash");
  void p.offsetWidth;
  p.classList.add("setflash");
  setTimeout(() => p.classList.remove("setflash"), 800);
}

// ─── Actualizar UI ─────────────────────────────────────────────────────────
function actualizarMarcador() {
  // Scores (con soporte tie-break)
  if (enTiebreak) {
    document.getElementById("scoreHome").textContent  = idxHome;
    document.getElementById("scoreGuest").textContent = idxGuest;
  } else {
    document.getElementById("scoreHome").textContent  = PUNTOS_DISPLAY[idxHome];
    document.getElementById("scoreGuest").textContent = PUNTOS_DISPLAY[idxGuest];
  }

  // Badges deuce/ventaja
  const bH = document.getElementById("badgeHome");
  const bG = document.getElementById("badgeGuest");
  bH.className = "badge empty"; bH.textContent = "";
  bG.className = "badge empty"; bG.textContent = "";

  if (!enTiebreak) {
    if (esDeuce()) {
      bH.className = "badge deuce"; bH.textContent = "DEUCE";
      bG.className = "badge deuce"; bG.textContent = "DEUCE";
    } else if (hayVentaja()) {
      const q = quienTieneVentaja();
      if (q === "home")  { bH.className = "badge ventaja"; bH.textContent = "AD"; }
      else               { bG.className = "badge ventaja"; bG.textContent = "AD"; }
    }
  }

  // Nombres
  document.getElementById("nombreHome").textContent  = nombreHome;
  document.getElementById("nombreGuest").textContent = nombreGuest;

  // Sets
  for (let i = 0; i < 3; i++) {
    const h = document.getElementById("setHome"+(i+1));
    const g = document.getElementById("setGuest"+(i+1));
    h.textContent = setsHome[i];
    g.textContent = setsGuest[i];
    h.classList.toggle("activo", i === setActual);
    g.classList.toggle("activo", i === setActual);
    // Tie-break: sets pueden tener valores altos → reducir fuente
    const esTB = (setsHome[i] >= 7 || setsGuest[i] >= 7);
    h.classList.toggle("tiebreak", esTB);
    g.classList.toggle("tiebreak", esTB);
  }

  // Saque
  document.getElementById("flechaDer").classList.toggle("activa",  saqueDerecha);
  document.getElementById("flechaIzq").classList.toggle("activa", !saqueDerecha);

  guardarEstado();
}

// ─── Lógica de puntos ──────────────────────────────────────────────────────
function sumar(equipo) {
  // Guardar snapshot ANTES de modificar
  historial.push(snapshot());

  if (enTiebreak) {
    sumarTiebreak(equipo);
  } else {
    sumarNormal(equipo);
  }

  actualizarMarcador();
}

function sumarNormal(equipo) {
  const rival = equipo === "home" ? "guest" : "home";

  // Caso ventaja: el que tiene ventaja gana el juego; el otro vuelve a deuce
  if (hayVentaja()) {
    if (quienTieneVentaja() === equipo) {
      // Gana el juego
      ganarJuego(equipo);
    } else {
      // Vuelve a deuce (40-40)
      idxHome  = 3;
      idxGuest = 3;
      saqueDerecha = !saqueDerecha;
    }
    return;
  }

  // Caso deuce: el siguiente punto da ventaja (índice 4)
  if (esDeuce()) {
    if (equipo === "home") idxHome  = 4;
    else                   idxGuest = 4;
    saqueDerecha = !saqueDerecha;
    return;
  }

  // Caso normal
  if (equipo === "home") {
    if (idxHome < 3) { idxHome++; animarScore("scoreHome"); saqueDerecha = !saqueDerecha; }
    else { ganarJuego("home"); }
  } else {
    if (idxGuest < 3) { idxGuest++; animarScore("scoreGuest"); saqueDerecha = !saqueDerecha; }
    else { ganarJuego("guest"); }
  }
}

function sumarTiebreak(equipo) {
  if (equipo === "home") { idxHome++;  animarScore("scoreHome"); }
  else                   { idxGuest++; animarScore("scoreGuest"); }
  saqueDerecha = !saqueDerecha;

  // En tie-break: ganar con ≥7 puntos y 2 de diferencia
  if ((idxHome >= 7 || idxGuest >= 7) && Math.abs(idxHome - idxGuest) >= 2) {
    const ganador = idxHome > idxGuest ? "home" : "guest";
    ganarJuego(ganador);
  }
}

function ganarJuego(equipo) {
  idxHome = 0; idxGuest = 0;
  saqueDerecha = true;
  enTiebreak = false;
  if (equipo === "home") setsHome[setActual]++;
  else                   setsGuest[setActual]++;

  animarScore(equipo === "home" ? "scoreHome" : "scoreGuest");
  verificarSet();
}

function verificarSet() {
  const h = setsHome[setActual];
  const g = setsGuest[setActual];

  // Tie-break a 6-6
  if (h === 6 && g === 6) {
    enTiebreak = true;
    idxHome = 0; idxGuest = 0;
    return;
  }

  // Ganó el set: ≥6 juegos con 2 de diferencia, o 7 (tras tie-break de set de ventaja)
  const ganoSet =
    (h >= 6 || g >= 6) && Math.abs(h - g) >= 2;

  if (ganoSet) {
    flashPanel();
    if (setActual < 2) setActual++;
  }
}

// ─── Restar (con historial) ────────────────────────────────────────────────
function restar(equipo) {
  historial.push(snapshot());
  if (equipo === "home"  && idxHome  > 0) idxHome--;
  if (equipo === "guest" && idxGuest > 0) idxGuest--;
  actualizarMarcador();
}

// ─── Cambiar saque ─────────────────────────────────────────────────────────
function cambiarSaque() {
  saqueDerecha = !saqueDerecha;
  actualizarMarcador();
}

// ─── Undo ──────────────────────────────────────────────────────────────────
function snapshot() {
  return {
    idxHome, idxGuest,
    setsHome: [...setsHome], setsGuest: [...setsGuest],
    setActual, saqueDerecha, enTiebreak
  };
}

function deshacer() {
  if (!historial.length) return;
  const u = historial.pop();
  idxHome      = u.idxHome;
  idxGuest     = u.idxGuest;
  setsHome     = [...u.setsHome];
  setsGuest    = [...u.setsGuest];
  setActual    = u.setActual;
  saqueDerecha = u.saqueDerecha;
  enTiebreak   = u.enTiebreak;
  actualizarMarcador();
}

// ─── Editar nombre ─────────────────────────────────────────────────────────
function editarNombre(e) {
  const actual = e === "home" ? nombreHome : nombreGuest;
  const nuevo  = prompt("Nuevo nombre del equipo:", actual);
  if (nuevo && nuevo.trim()) {
    if (e === "home") nombreHome  = nuevo.trim();
    else              nombreGuest = nuevo.trim();
    actualizarMarcador();
  }
}

// ─── Reset ─────────────────────────────────────────────────────────────────
function resetear() {
  if (!confirm("¿Resetear el marcador completamente?")) return;
  idxHome = idxGuest = 0;
  setsHome = [0,0,0]; setsGuest = [0,0,0];
  setActual = 0; saqueDerecha = true;
  historial = []; enTiebreak = false;
  localStorage.removeItem("marcadorPadel");
  actualizarMarcador();
  // Reinicia el cronómetro
  clearInterval(timerInterval);
  iniciarCronometro();
}

// ─── Persistencia ──────────────────────────────────────────────────────────
function guardarEstado() {
  const estado = {
    idxHome, idxGuest,
    setsHome, setsGuest,
    setActual, saqueDerecha,
    nombreHome, nombreGuest,
    enTiebreak
  };
  try { localStorage.setItem("marcadorPadel", JSON.stringify(estado)); } catch(e) {}
}

function cargarEstado() {
  try {
    const data = localStorage.getItem("marcadorPadel");
    if (!data) return;
    const s = JSON.parse(data);
    // Asignamos explícitamente para no contaminar window
    idxHome      = s.idxHome      ?? 0;
    idxGuest     = s.idxGuest     ?? 0;
    setsHome     = s.setsHome     ?? [0,0,0];
    setsGuest    = s.setsGuest    ?? [0,0,0];
    setActual    = s.setActual    ?? 0;
    saqueDerecha = s.saqueDerecha ?? true;
    nombreHome   = s.nombreHome   ?? "HOME";
    nombreGuest  = s.nombreGuest  ?? "GUEST";
    enTiebreak   = s.enTiebreak   ?? false;
  } catch(e) {}
}

// ─── Cronómetro ────────────────────────────────────────────────────────────
function iniciarCronometro() {
  inicio = new Date();
  const cron = document.getElementById("cronometro");
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const diff = Math.floor((new Date() - inicio) / 1000);
    const h = String(Math.floor(diff / 3600)).padStart(2, "0");
    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
    const s = String(diff % 60).padStart(2, "0");
    cron.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

// ─── WhatsApp ──────────────────────────────────────────────────────────────
function enviarWhatsApp() {
  const ahora = new Date().toLocaleString("es-ES");
  const cron  = document.getElementById("cronometro").textContent;

  // Calcular sets ganados
  let setsGanadosHome = 0, setsGanadosGuest = 0;
  for (let i = 0; i <= setActual; i++) {
    if (setsHome[i] > setsGuest[i]) setsGanadosHome++;
    else if (setsGuest[i] > setsHome[i]) setsGanadosGuest++;
  }

  let texto = `🎾 *Partido de Pádel* 🎾\n`;
  texto += `📅 ${ahora}\n\n`;
  texto += `🏆 *Resultado:*\n`;
  texto += `🔴 *${nombreHome}*: ${setsGanadosHome} sets\n`;
  texto += `🟢 *${nombreGuest}*: ${setsGanadosGuest} sets\n\n`;
  texto += `📊 *Detalle de sets:*\n`;
  for (let i = 0; i <= setActual; i++) {
    if (setsHome[i] > 0 || setsGuest[i] > 0) {
      texto += `  Set ${i+1}: ${setsHome[i]} - ${setsGuest[i]}\n`;
    }
  }
  texto += `\n⏱️ Duración: ${cron}\n`;
  texto += `\n_Enviado desde el Marcador de César_ 🎾`;

  const numero = prompt("Número de WhatsApp (sin + ni espacios, ej: 50760000000):");
  if (!numero || !numero.trim()) return;
  const url = `https://wa.me/${numero.trim()}?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
}

// ─── Pantalla completa ─────────────────────────────────────────────────────
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
